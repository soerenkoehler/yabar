name: Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    defaults:
      run:
        working-directory: ./deployment

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: TF setup
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0

      - name: TF Initialize
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ vars.PROJECT_PREFIX }}.tfstate"\
            -backend-config="use_azuread_auth=true"

      - name: TF Plan
        run: |
          tofu plan \
            -var="project_global_prefix=${{ vars.PROJECT_GLOBAL_PREFIX }}" \
            -var="project_prefix=${{ vars.PROJECT_PREFIX }}" \
            -var="project_resource_group=${{ vars.PROJECT_RESOURCE_GROUP }}" \
            -out=./plan.out

      - name: TF Apply
        run: |
          tofu apply \
            -auto-approve \
            ./plan.out

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure Functions Zip Deploy
        uses: Azure/functions-action@v2
        with:
          app-name: ${{ vars.PROJECT_GLOBAL_PREFIX }}
          package: '../swa/api'

      - name: Deploy to Static Web App
        env:
          DEPLOY_ENV: >-
            ${{
              case(
                github.ref_name == 'main', 'production',
                'preview'
              )
            }}
          PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX }}
        run: ./deploy.sh
