name: Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: 'Node Setup'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install SWA Cli
        run: npm install -g @azure/static-web-apps-cli

      - name: TF setup
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0

      - name: TF Initialize
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ vars.PROJECT_PREFIX }}.tfstate"\
            -backend-config="use_azuread_auth=true"
        working-directory: ./tf

      - name: TF Plan
        run: |
          tofu plan \
            -var="project_prefix=${{ vars.PROJECT_PREFIX }}" \
            -var="project_global_prefix=${{ vars.PROJECT_GLOBAL_PREFIX }}" \
            -var="project_resource_group=${{ vars.PROJECT_RESOURCE_GROUP }}" \
            -var="auth_google_client_id=${{ secrets.AUTH_GOOGLE_CLIENT_ID }}" \
            -out=./plan.out
        working-directory: ./tf

      - name: TF Apply
        run: |
          tofu apply \
            -auto-approve \
            ./plan.out
        working-directory: ./tf

      - name: Build Functions
        run: npm install
        working-directory: ./swa/api

      - name: Log in to Azure via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure Functions Zip Deploy
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.PROJECT_GLOBAL_PREFIX }}
          package: './swa/api'

      - name: Deploy to Static Web App
        run: |
          # -----
          # get tofu outputs
          # -----
          pushd ./tf
          OUTPUT=$(
            tofu output -json 2>/dev/null
          )
          popd

          # -----
          # create config file
          # -----
          jq -r <<<"$OUTPUT" >./swa/web/config.json \
            '{
              api_hostname: .api_hostname.value,
              auth_google_client_id: "${{ secrets.AUTH_GOOGLE_CLIENT_ID }}"
            }'

          # -----
          # set deployment parameter
          # -----
          DEPLOYMENT_TOKEN=$(
            jq -r '.swa_deployment_token.value // ""' <<<"$OUTPUT"
          )

          # -----
          # deploy SWA
          # -----
          pushd ./swa
          swa deploy \
            --verbose silly \
            --deployment-token "$DEPLOYMENT_TOKEN"
          popd
