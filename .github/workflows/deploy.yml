name: Deploy

on:
  push:
    branches:
      - main
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to Static Web App
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          DEPLOY_ENV: >-
            ${{
              case(
                github.ref_name == 'main', 'production',
                'preview'
              )
            }}
        run: ./deploy.sh
