<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWA Queue Writer</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 0.5rem; max-width: 400px; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        #statusMessage, #readStatusMessage { margin-top: 1rem; font-weight: bold; }
        .hidden { display: none; }
    </style>
    <script src="./app.js" defer></script>
</head>
<body>
    <div id="g_id_onload" data-client_id="" data-callback="handleCredentialResponse"></div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="authStatus" style="margin-top: 0.75rem;">Not logged in</div>
    <button id="logoutButton" type="button" style="display: none; margin-top: 0.5rem;">Logout</button>

    <h1>Submit Message to Queue</h1>

    <form id="queueForm">
        <div class="form-group">
            <label for="messageInput">Message Payload:</label>
            <input type="text" id="messageInput" required placeholder="Enter text here...">
        </div>
        <button type="submit">Submit to Queue</button>
    </form>

    <section id="readFromQueueSection" class="hidden">
        <h1>Read From Queue</h1>
        <button id="showReadButton" type="button">Show</button>
        <div id="readStatusMessage"></div>
    </section>

    <div id="statusMessage"></div>
</body>
</html>
