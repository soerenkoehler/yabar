<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharepass</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        .auth-logged-in #topMenuLogin,
        .auth-logged-out #topMenuMain {
            display: none
        }

        .auth-logged-in #topMenuMain,
        .auth-logged-out #topMenuLogin {
            display: block
        }

        .mode-reading #writeMessageSection,
        .mode-writing #readMessageSection,
        .state-idle #mainPageStatus,
        .state-idle #readMessageSection,
        .state-idle #writeMessageSection,
        .state-input #readMessageOutput,
        .state-input #writeMessageOutput,
        .state-submitting #readMessageOutput,
        .state-submitting #writeMessageOutput,
        .state-error #readMessageOutput,
        .state-error #writeMessageOutput,
        .state-success #mainPageStatus {
            display: none
        }

        .state-input .mode-reading #readMessageSection,
        .state-input .mode-writing #writeMessageSection,
        .state-submitting #mainPageStatus,
        .state-error #mainPageStatus,
        .state-success #readMessageOutput,
        .state-success #writeMessageOutput {
            display: block
        }

        .state-error #mainPageStatus {
            color: red
        }

        #readMessageOutput,
        #writeMessageOutput,
        #mainPageStatus {
            margin-top: 1rem;
            font-weight: bold
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 0.5rem;
            max-width: 400px;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
    </style>
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div id="topMenu">
        <div id="topMenuLogin">
            <div id="g_id_onload" data-client_id="" data-callback="handleGoogleGsiResponse"></div>
            <div id="loginButton" class="g_id_signin" data-type="standard"></div>
        </div>

        <div id="topMenuMain">
            <button id="topMenuModeWrite" type="button">New Message</button>
            <button id="topMenuModeRead" type="button">Read Message</button>
            <div id="authStatus">Not logged in</div>
            <button id="logoutButton" type="button">Logout</button>
        </div>
    </div>

    <div id="mainPage">
        <section id="writeMessageSection">
            <h1>Write Message</h1>

            <form id="writeMessageInputForm">
                <div class="form-group">
                    <label for="writeMessageInputExpiration">Expires In:</label>
                    <select id="writeMessageInputExpiration" required>
                        <option value="" disabled selected>Loading options...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="messageInput">Message Payload:</label>
                    <input type="text" id="messageInput" required placeholder="Enter text here...">
                </div>
                <button type="submit">Send</button>
            </form>

            <div id="writeMessageOutput">
                <div>
                    Message URL (no key):
                    <a id="writeMessageOutputUrlTwoStep" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
                <div>
                    Key:
                    <span id="writeMessageOutputKeyTwoStep"></span>
                </div>
                <div>
                    One-Click URL:
                    <a id="writeMessageOutputUrlOneClick" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
            </div>
        </section>

        <section id="readMessageSection">
            <h1>Read Message</h1>

            <form id="readMessageInputForm">
                <div class="form-group">
                    <label for="readMessageInputMessageId">Message ID (base64):</label>
                    <input type="text" id="readMessageInputMessageId" required placeholder="Enter base64 messageId...">
                </div>
                <div class="form-group">
                    <label for="readMessageInputKey">Key (base64):</label>
                    <input type="password" id="readMessageInputKey" placeholder="Enter base64 key...">
                </div>
                <button type="submit">Show</button>
            </form>

            <div id="readMessageOutput"></div>
        </section>

        <span id="mainPageStatus"></span>
    </div>
</body>

</html>
