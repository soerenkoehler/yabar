<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharepass</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        .auth-logged-out #logoutButton,
        .auth-logged-out #topMenuMain {
            display: none
        }

        .auth-logged-in #logoutButton,
        .auth-logged-in #topMenuMain {
            display: block
        }

        .mode-reading #writeMessageSection,
        .mode-writing #readMessageSection,
        .state-idle #mainPageStatus,
        .state-idle #readMessageSection,
        .state-idle #writeMessageSection,
        .state-input #readMessageOutput,
        .state-input #writeMessageOutput,
        .state-submitting #readMessageOutput,
        .state-submitting #writeMessageOutput,
        .state-error #readMessageOutput,
        .state-error #writeMessageOutput,
        .state-success #mainPageStatus {
            display: none
        }

        .state-input .mode-reading #readMessageSection,
        .state-input .mode-writing #writeMessageSection,
        .state-submitting #mainPageStatus,
        .state-error #mainPageStatus,
        .state-success #readMessageOutput,
        .state-success #writeMessageOutput {
            display: block
        }

        .state-error #mainPageStatus {
            color: red
        }

        #readMessageOutput,
        #writeMessageOutput,
        #mainPageStatus {
            margin-top: 1rem;
            font-weight: bold
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        label:has(input:disabled) {
            color: #a0aec0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 0.5rem;
            max-width: 400px;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }
    </style>
    <style>
        /* Logout Button matching Google Standard Button geometry and typography */
        .g_id_signout_icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: none;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .g_id_signout_icon:hover {
            background-color: #f7f8f8;
            border-color: #d2e3fc;
        }

        .g_id_signout_icon:active {
            background-color: #f1f3f4;
        }

        .g_id_signout_icon svg {
            margin-left: 8px;
            width: 24px;
            height: 24px;
            fill: currentColor;
            display: block;
        }
    </style>
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div id="topMenu">
        <div id="topMenuLogin">
            <div id="g_id_onload" data-client_id="" data-callback="handleGoogleGsiResponse"></div>
            <div id="loginButton" class="g_id_signin" data-type="icon" data-shape="square" data-theme="outline"
                data-size="large">
            </div>
            <button id="logoutButton" class="g_id_signout_icon" type="button" title="Sign out" aria-label="Sign out">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
                </svg>
            </button>
            <div id="authStatus">Not logged in</div>
        </div>

        <div id="topMenuMain">
            <button id="topMenuModeWrite" type="button">New Message</button>
            <button id="topMenuModeRead" type="button">Read Message</button>
        </div>
    </div>

    <div id="mainPage">
        <section id="writeMessageSection">
            <h1>Write Message</h1>

            <form id="writeMessageInputForm">
                <div class="form-group">
                    <label>Expires In:
                        <select id="writeMessageInputExpiration" required>
                            <option value="" disabled selected>Loading options...</option>
                        </select>
                    </label>
                </div>
                <div class="form-group">
                    <label>Message Payload:
                        <input id="messageInput" type="text" required placeholder="Enter text here..." />
                    </label>
                </div>
                <button type="submit" disabled>Send</button>
            </form>

            <div id="writeMessageOutput">
                <div>
                    Message URL (no key):
                    <a id="writeMessageOutputUrlTwoStep" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
                <div>
                    Key:
                    <span id="writeMessageOutputKeyTwoStep"></span>
                </div>
                <div>
                    One-Click URL:
                    <a id="writeMessageOutputUrlOneClick" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
            </div>
        </section>

        <section id="readMessageSection">
            <h1>Read Message</h1>

            <form id="readMessageInputForm">
                <div class="form-group">
                    <label>
                        Message ID:
                        <input id="readMessageInputMessageId" type="text" required placeholder="Enter messageId..." />
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        Key:
                        <input id="readMessageInputKey" type="password" placeholder="Enter key..." />
                    </label>
                </div>
                <button type="submit" disabled>Show</button>
            </form>

            <div id="readMessageOutput"></div>
        </section>

        <span id="mainPageStatus"></span>
    </div>
</body>

</html>
