<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharepass</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        .is-submitting #readMessageOutput,
        .is-submitting #writeMessageOutput,
        .is-error #readMessageOutput,
        .is-error #writeMessageOutput {
            display: none
        }

        .is-success #readMessageOutput,
        .is-success #writeMessageOutput {
            display: block
        }

        .is-submitting #globalStatusText,
        .is-error #globalStatusText {
            display: block
        }

        .is-error #globalStatusText {
            color: red
        }

        .is-success #globalStatusText {
            display: none
        }

        #readMessageOutput,
        #writeMessageOutput,
        #globalStatusText {
            margin-top: 1rem;
            font-weight: bold
        }

        .hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            max-width: 400px;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
    </style>
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div id="g_id_onload" data-client_id="" data-callback="handleGoogleGsiResponse"></div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="authStatus" style="margin-top: 0.75rem;">Not logged in</div>
    <button id="logoutButton" type="button" style="display: none; margin-top: 0.5rem;">Logout</button>

    <div id="globalStatus">
        <section id="writeMessageSection" class="hidden">
            <h1>Write Message</h1>

            <form id="writeMessageForm">
                <div class="form-group">
                    <label for="expirationInput">Expires In:</label>
                    <select id="expirationInput" required>
                        <option value="" disabled selected>Loading options...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="messageInput">Message Payload:</label>
                    <input type="text" id="messageInput" required placeholder="Enter text here...">
                </div>
                <button type="submit">Send</button>
            </form>

            <div id="writeMessageOutput" class="hidden">
                <div>
                    Message URL (no key): <a data-role="two-step-link" href="" target="_blank"
                        rel="noreferrer noopener"></a>
                </div>
                <div>
                    Key: <span data-role="key-text"></span>
                </div>
                <div>
                    One-Click URL: <a data-role="one-click-link" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
            </div>
        </section>

        <section id="readMessageSection" class="hidden">
            <h1>Read Message</h1>

            <button id="showReadButton" type="button">Show</button>

            <div id="readMessageOutput"></div>
        </section>

        <span id="globalStatusText"></span>
    </div>
</body>

</html>
