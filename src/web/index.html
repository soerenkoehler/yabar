<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharepass</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
        }

        .auth-logged-out #logoutButton,
        .auth-logged-out #topMenuMain {
            display: none
        }

        .auth-logged-in #logoutButton,
        .auth-logged-in #topMenuMain {
            display: block
        }

        .mode-reading #writeMessageSection,
        .mode-writing #readMessageSection,
        .state-idle #mainPageStatus,
        .state-idle #readMessageSection,
        .state-idle #writeMessageSection,
        .state-input #readMessageOutput,
        .state-input #writeMessageOutput,
        .state-submitting #readMessageOutput,
        .state-submitting #writeMessageOutput,
        .state-error #readMessageOutput,
        .state-error #writeMessageOutput,
        .state-success #mainPageStatus {
            display: none
        }

        .state-input .mode-reading #readMessageSection,
        .state-input .mode-writing #writeMessageSection,
        .state-submitting #mainPageStatus,
        .state-error #mainPageStatus,
        .state-success #readMessageOutput,
        .state-success #writeMessageOutput {
            display: block
        }

        .state-error #mainPageStatus {
            color: red
        }

        #readMessageOutput,
        #writeMessageOutput,
        #mainPageStatus {
            margin-top: 1rem;
            font-weight: bold
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        label:has(input:disabled) {
            color: #a0aec0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 0.5rem;
            max-width: 400px;
        }

        button {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        #topMenu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        #topMenuLogin {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        #topMenuMain {
            --tab-bg: #f4f6f9;
            --tab-fg: #3f4f61;
            --tab-border: #d6dce5;
            --tab-active-bg: #ffffff;
            --tab-active-fg: #14213d;
            --tab-active-border: #a6b5c9;

            display: inline-flex;
            align-items: center;
            padding: 0.25rem;
            gap: 0.25rem;
            border: 1px solid var(--tab-border);
            border-radius: 999px;
            background: linear-gradient(180deg, #fafbfd 0%, #f1f4f8 100%);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        #topMenuMain button {
            min-width: 9rem;
            border: 1px solid transparent;
            border-radius: 999px;
            background-color: var(--tab-bg);
            color: var(--tab-fg);
            font-weight: 600;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        #topMenuMain button:hover {
            background-color: #e8edf4;
            color: #223347;
        }

        #topMenuMain button:focus-visible {
            outline: none;
            border-color: #7d9cc5;
            box-shadow: 0 0 0 2px rgba(125, 156, 197, 0.35);
        }

        #topMenuMain button[aria-selected="true"] {
            background-color: var(--tab-active-bg);
            color: var(--tab-active-fg);
            border-color: var(--tab-active-border);
            box-shadow: 0 2px 6px rgba(13, 35, 66, 0.14);
        }

        form button[type="submit"] {
            --submit-bg: #f4f6f9;
            --submit-fg: #223347;
            --submit-border: #a6b5c9;

            min-width: 8rem;
            border: 1px solid var(--submit-border);
            border-radius: 999px;
            background: linear-gradient(180deg, #ffffff 0%, var(--submit-bg) 100%);
            color: var(--submit-fg);
            font-weight: 600;
            box-shadow: 0 1px 3px rgba(13, 35, 66, 0.12);
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        form button[type="submit"]:hover:not(:disabled) {
            background: linear-gradient(180deg, #ffffff 0%, #e8edf4 100%);
            color: #14213d;
            box-shadow: 0 2px 6px rgba(13, 35, 66, 0.16);
        }

        form button[type="submit"]:focus-visible {
            outline: none;
            border-color: #7d9cc5;
            box-shadow: 0 0 0 2px rgba(125, 156, 197, 0.35), 0 1px 3px rgba(13, 35, 66, 0.12);
        }

        form button[type="submit"]:disabled {
            background: #edf1f6;
            color: #7a8696;
            border-color: #d4dbe4;
            box-shadow: none;
            opacity: 0.85;
        }

        @media (max-width: 640px) {
            #topMenuMain {
                width: 100%;
            }

            #topMenuMain button {
                flex: 1;
                min-width: 0;
            }
        }
    </style>
    <style>
        /* Logout Button matching Google Standard Button geometry and typography */
        .g_id_signout_icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: none;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .g_id_signout_icon:hover {
            background-color: #f7f8f8;
            border-color: #d2e3fc;
        }

        .g_id_signout_icon:active {
            background-color: #f1f3f4;
        }

        .g_id_signout_icon svg {
            margin-left: 8px;
            width: 24px;
            height: 24px;
            fill: currentColor;
            display: block;
        }
    </style>
    <script type="module" src="./app.js"></script>
</head>

<body>
    <div id="topMenu">
        <div id="topMenuMain" role="tablist" aria-label="Message mode selector">
            <button id="topMenuModeWrite" type="button" role="tab" aria-selected="false" aria-controls="writeMessageSection">New Message</button>
            <button id="topMenuModeRead" type="button" role="tab" aria-selected="false" aria-controls="readMessageSection">Read Message</button>
        </div>
        <div id="topMenuLogin">
            <div id="g_id_onload" data-client_id="" data-callback="handleGoogleGsiResponse"></div>
            <div id="loginButton" class="g_id_signin" data-type="icon" data-shape="square" data-theme="outline"
                data-size="large">
            </div>
            <button id="logoutButton" class="g_id_signout_icon" type="button" title="Sign out" aria-label="Sign out">
                <svg height="24px" width="24px" viewBox="0 -960 960 960"
                    fill="#1f1f1f">
                    <path
                        d="M202.87-111.87q-37.78 0-64.39-26.61t-26.61-64.39v-554.26q0-37.78 26.61-64.39t64.39-26.61h279.04v91H202.87v554.26h279.04v91H202.87Zm434.02-156.65L574-333.93 674.56-434.5H358.09v-91h316.47L574-626.07l62.89-65.41L848.13-480 636.89-268.52Z" />
                </svg>
            </button>
            <div id="authStatus">Not logged in</div>
        </div>
    </div>

    <div id="mainPage">
        <section id="writeMessageSection">
            <form id="writeMessageInputForm">
                <div class="form-group">
                    <label>Expires In:
                        <select id="writeMessageInputExpiration" required>
                            <option value="" disabled selected>Loading options...</option>
                        </select>
                    </label>
                </div>
                <div class="form-group">
                    <label>Message Payload:
                        <input id="messageInput" type="text" required placeholder="Enter text here..." />
                    </label>
                </div>
                <button type="submit" disabled>Send</button>
            </form>

            <div id="writeMessageOutput">
                <div>
                    Message URL (no key):
                    <a id="writeMessageOutputUrlTwoStep" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
                <div>
                    Key:
                    <span id="writeMessageOutputKeyTwoStep"></span>
                </div>
                <div>
                    One-Click URL:
                    <a id="writeMessageOutputUrlOneClick" href="" target="_blank" rel="noreferrer noopener"></a>
                </div>
            </div>
        </section>

        <section id="readMessageSection">
            <form id="readMessageInputForm">
                <div class="form-group">
                    <label>
                        Message ID:
                        <input id="readMessageInputMessageId" type="text" required placeholder="Enter messageId..." />
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        Key:
                        <input id="readMessageInputKey" type="password" placeholder="Enter key..." />
                    </label>
                </div>
                <button type="submit" disabled>Show</button>
            </form>

            <div id="readMessageOutput"></div>
        </section>

        <span id="mainPageStatus"></span>
    </div>
</body>

</html>
