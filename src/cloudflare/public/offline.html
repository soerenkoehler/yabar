<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YABAR Offline</title>
    <meta name="theme-color" content="#9b5a37" />
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: sans-serif;
            background: linear-gradient(135deg, hsl(18, 30%, 55%) 0%, hsl(28, 45%, 72%) 50%, hsl(39, 80%, 87%) 100%);
            color: #2f1b13;
        }

        main {
            max-width: 32rem;
            width: 100%;
            background: rgba(251, 238, 216, 0.95);
            border: 1px solid #b47b53;
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: 0 8px 30px rgba(58, 33, 23, 0.2);
        }
    </style>
</head>

<body>
    <main>
        <h1>You are offline</h1>
        <p>YABAR needs a network connection to send and read messages.</p>
        <p>Reconnect and refresh to continue.</p>
    </main>
</body>

</html>
