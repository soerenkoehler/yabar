<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWA Queue Writer</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 0.5rem; max-width: 400px; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
        #statusMessage { margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div id="g_id_onload"
        data-client_id=""
        data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <div id="authStatus" style="margin-top: 0.75rem;">Not logged in</div>
    <button id="logoutButton" type="button" style="display: none; margin-top: 0.5rem;">Logout</button>

    <h1>Submit Message to Queue</h1>

    <form id="queueForm">
        <div class="form-group">
            <label for="messageInput">Message Payload:</label>
            <input type="text" id="messageInput" required placeholder="Enter text here...">
        </div>
        <button type="submit">Submit to Queue</button>
    </form>

    <div id="statusMessage"></div>

    <script>
        let config = {};
        window.config = config;

        async function loadConfig() {
            try {
                const response = await fetch('/config.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to load config.json (${response.status})`);
                }
                config = await response.json();
                window.config = config;
            } catch (error) {
                console.error('Could not load config.json:', error);
                config = {};
                window.config = config;
            }
        }

        let currentUserHint = null;

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                return JSON.parse(jsonPayload);
            } catch {
                return null;
            }
        }

        function setLoggedIn(username, userHint) {
            const authStatus = document.getElementById('authStatus');
            const logoutButton = document.getElementById('logoutButton');
            authStatus.textContent = `logged in as ${username}`;
            logoutButton.style.display = 'inline-block';
            currentUserHint = userHint || null;
        }

        function setLoggedOut() {
            const authStatus = document.getElementById('authStatus');
            const logoutButton = document.getElementById('logoutButton');
            authStatus.textContent = 'Not logged in';
            logoutButton.style.display = 'none';
            currentUserHint = null;
        }

        async function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if (!payload) {
                setLoggedOut();
                return;
            }

            const username = payload.name || payload.email || payload.sub || 'unknown user';
            const userHint = payload.email || payload.sub;
            setLoggedIn(username, userHint);
        }

        async function initPage() {
            await loadConfig();

            document.getElementById('g_id_onload').setAttribute('data-client_id') = window.config.auth_google_client_id;

            document.getElementById('logoutButton').addEventListener('click', () => {
                if (currentUserHint && window.google?.accounts?.id?.revoke) {
                    google.accounts.id.revoke(currentUserHint, () => {
                        setLoggedOut();
                    });
                } else {
                    setLoggedOut();
                }

                // Optional: avoid silent auto-select on next load
                if (window.google?.accounts?.id?.disableAutoSelect) {
                    google.accounts.id.disableAutoSelect();
                }
            });

            document.getElementById('queueForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const messageInput = document.getElementById('messageInput');
                const statusMessage = document.getElementById('statusMessage');

                statusMessage.style.color = 'black';
                statusMessage.textContent = 'Submitting...';

                try {
                    const response = await fetch(window.config.api_hostname + '/api/writeToQueue', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ value: messageInput.value })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        statusMessage.style.color = 'green';
                        statusMessage.textContent = `Success: ${result.message}`;
                        messageInput.value = '';
                    } else {
                        const errorText = await response.text();
                        statusMessage.style.color = 'red';
                        statusMessage.textContent = `Error (${response.status}): ${errorText}`;
                    }
                } catch (error) {
                    statusMessage.style.color = 'red';
                    statusMessage.textContent = `Network error occurred: ${error.message}`;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
